name: Deploy Avalonia Browser to GitHub Pages

on:
  push:
    branches: ["master"]
    # The site is the browser build of the viewer itself, so viewer code, package pins and this
    # workflow all change what gets deployed. Restricting the filter to Assets/Docs left the live
    # site stale after a template sync replaced the app code.
    paths:
      - "src/**"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Pinned by global.json so the workload install and the publish use the same SDK band.
          dotnet-version: '10.0.401'

      - name: Install workloads
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore src/CloudGlyph.Browser/CloudGlyph.Browser.csproj

      # Without the workload the SDK skips native linking and still exits 0, which ships a
      # dotnet.native.wasm without libSkiaSharp. Retrying as root covers the user-local install
      # case; the publish check below is the hard gate.
      - name: Ensure wasm-tools is visible to the SDK
        run: |
          set -euo pipefail
          probe() {
            dotnet msbuild src/CloudGlyph.Browser/CloudGlyph.Browser.csproj -nologo \
              -getProperty:NETCoreSdkVersion -getProperty:WasmNativeWorkloadAvailable | tee wasm-props.json
          }
          if ! probe || ! grep -q '"WasmNativeWorkloadAvailable": "true"' wasm-props.json; then
            echo "::warning::wasm-tools is not visible to SDK $(dotnet --version); reinstalling as root"
            sudo -E env "PATH=$PATH" "$(command -v dotnet)" workload install wasm-tools --skip-manifest-update
            probe
            grep -q '"WasmNativeWorkloadAvailable": "true"' wasm-props.json \
              || echo "::warning::wasm-tools is still not visible; the native-linking check will fail the build"
          fi
          dotnet workload list

      - name: Publish Avalonia Browser
        run: dotnet publish src/CloudGlyph.Browser/CloudGlyph.Browser.csproj -c Release -o publish

      - name: Verify native libraries are linked
        run: |
          set -euo pipefail
          wasm=$(ls publish/wwwroot/_framework/dotnet.native.*.wasm | head -n1)
          size=$(stat -c%s "$wasm")
          echo "dotnet.native.wasm = $size bytes"
          if [ "$size" -lt 5000000 ]; then
            echo "::error::$wasm is $size bytes: libSkiaSharp was not linked into the runtime."
            exit 1
          fi
          rsp=$(find src/CloudGlyph.Browser/obj -path '*for-publish*' -name emcc-link.rsp | head -n1)
          test -n "$rsp"
          grep -q 'libSkiaSharp' "$rsp"
          grep -q 'libHarfBuzzSharp' "$rsp"
          test -f publish/wwwroot/_framework/av-webview.mjs
          echo "native libraries linked via $rsp"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
